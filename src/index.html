<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Garden - Warm Aesthetics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">

        <!-- 环境滤镜层 (全局暖光/天气/时间) -->
        <div class="env-filter-overlay time-sunset"></div>

        <!-- 层级 1: 世界层 (The Garden, 2.5D 透视) -->
        <main class="layer-world" aria-label="2.5D 植物花园场景">
            <div class="world-3d-container">
                <!-- 纯背景网格层，带有渐隐遮罩 (单独抽离以防打破3D上下文) -->
                <div class="grid-bg"></div>

                <!-- 香炉依然是固定在中间的地标 -->
                <div class="incense-node" style="top: 50%; left: 50%;">
                    [燃香实体]
                </div>

                <!-- 手植模式实时占地预览椭圆 -->
                <div id="footprint-preview" class="footprint-preview" hidden aria-hidden="true"></div>

                <!-- 动态花园种植床 -->
                <div id="world-plants" class="footprints-visible"></div>
            </div>
        </main>

        <!-- 层级 2: HUD 最高层 -->
        <div class="layer-hud">

            <!-- 魔法控制按钮组 -->
            <nav class="ui-magic-buttons" aria-label="花园控制面板">
                <button id="btn-randomize" type="button" class="magic-btn">🎲 随机生态群落 (55株)</button>
                <button id="btn-toggle-footprints" type="button" class="magic-btn" aria-pressed="true">🪐 占地圈与高度标尺: 开</button>
                <button id="btn-cycle-color" type="button" class="magic-btn">🎨 色彩: 原生真彩</button>
                <button id="btn-toggle-catalog" type="button" class="magic-btn" aria-expanded="false" aria-controls="catalog-drawer">🌿 植物图鉴与手植 (共 6 种)</button>
                <button id="btn-focus-mode" type="button" class="magic-btn">✨ 开启心流模式</button>
                <a id="btn-godot-lighting" href="light_demo.html" class="magic-btn" style="text-decoration:none; display:inline-flex; align-items:center;">🏮 切换 Godot 2.5D 光影版</a>
            </nav>

            <!-- 手植模式提示条 -->
            <div id="planting-banner" class="planting-banner" role="status" aria-live="polite" hidden></div>

            <!-- 植物悬停检视卡片 -->
            <section id="plant-inspector-card" class="plant-inspector-card" aria-label="植物详情检视" aria-live="polite" hidden>
                <div class="inspector-header">
                    <div>
                        <h2 class="inspector-zh" data-field="zh-name">银杏</h2>
                        <p class="inspector-sci" data-field="sci-name" lang="la">Ginkgo biloba</p>
                    </div>
                    <div class="inspector-tags">
                        <span class="inspector-tag" data-field="type-tag">乔木</span>
                        <span class="inspector-tag habit" data-field="habit-tag">伞冠型</span>
                    </div>
                </div>
                <dl class="inspector-metrics">
                    <div class="metric-row">
                        <dt>自然株高</dt>
                        <dd data-field="botanical-height">20 – 35 m</dd>
                    </div>
                    <div class="metric-row">
                        <dt>当前采样高度</dt>
                        <dd data-field="sampled-height">180 px</dd>
                    </div>
                    <div class="metric-row">
                        <dt>地面占地椭圆</dt>
                        <dd data-field="footprint-size">12 × 7 px</dd>
                    </div>
                </dl>
                <p class="inspector-brief" data-field="brief"></p>
            </section>

            <!-- 可折叠植物图鉴与手植抽屉 -->
            <aside id="catalog-drawer" class="catalog-drawer" aria-label="植物图鉴与手植抽屉" hidden>
                <div class="catalog-drawer-header">
                    <h2 class="catalog-title">🌿 植物图鉴与手植</h2>
                    <button id="btn-close-catalog" type="button" class="catalog-close-btn" aria-label="关闭图鉴抽屉">✕</button>
                </div>

                <div class="catalog-controls">
                    <div class="catalog-search-row">
                        <label for="catalog-search" class="visually-hidden">搜索植物名称或拉丁学名</label>
                        <input id="catalog-search" type="search" class="catalog-search-input" placeholder="搜索中文名 / 学名..." autocomplete="off">
                        <button id="btn-clear-garden" type="button" class="catalog-clear-btn">🧹 清空花园</button>
                    </div>
                    <div class="catalog-filter-pills" role="group" aria-label="按植物类型筛选">
                        <button type="button" class="catalog-filter-pill is-active" data-filter-type="all" aria-pressed="true">全部</button>
                        <button type="button" class="catalog-filter-pill" data-filter-type="tree" aria-pressed="false">🌳乔木</button>
                        <button type="button" class="catalog-filter-pill" data-filter-type="shrub" aria-pressed="false">🌿灌木</button>
                        <button type="button" class="catalog-filter-pill" data-filter-type="flower" aria-pressed="false">🌸花卉</button>
                        <button type="button" class="catalog-filter-pill" data-filter-type="groundcover" aria-pressed="false">🌱地被</button>
                    </div>
                </div>

                <div id="catalog-grid" class="catalog-grid"></div>
            </aside>
        </div>

        <!-- 层级 3: 终极沉浸模式 (Ambient Glass Backdrop) -->
        <div id="focus-mode-ui" class="ambient-glass-overlay">
            <button id="btn-close-focus" type="button" class="magic-btn close-focus-btn">退出心流模式</button>

            <!-- 左侧：记忆之池 (History Stream) -->
            <div class="focus-history-col">
                <div class="focus-history-stream">
                    <div class="focus-msg ai">在这个赛博花园里，每一株植物都映射着一段情绪的碎片。</div>
                    <div class="focus-msg user">我今天终于把那个纠结了很久的问题想清楚了，感觉心里一块石头落地。</div>
                    <div class="focus-msg ai">我感受到了一束明亮的金光。我已经将它化作一颗种子。</div>
                    <div class="focus-msg user">所以那些双色的竹林，其实是我过去的记忆？</div>
                    <div class="focus-msg ai">是的，你随时可以回到这里，它们会一直在霓虹中呼吸。</div>
                </div>
            </div>

            <!-- 右侧：心流输入舱 (Flow Input Area) -->
            <div class="focus-input-col">
                <label for="flow-textarea" class="visually-hidden">心流书写区</label>
                <textarea id="flow-textarea" class="flow-textarea" placeholder="把你的思绪投射到这片发光的环境中... (支持长文书写)"></textarea>
            </div>
        </div>
    </div>

    <script src="garden.js"></script>
</body>
</html>
